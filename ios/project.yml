name: Skein
options:
  bundleIdPrefix: com.kmtompkins3
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Skein:
    type: application
    platform: iOS
    sources:
      - path: Skein
    settings:
      base:
        PRODUCT_NAME: Skein
        PRODUCT_BUNDLE_IDENTIFIER: com.kmtompkins3.skein
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Skein/Skein.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Skein/Info.plist
    info:
      path: Skein/Info.plist
      properties:
        CFBundleDisplayName: Skein
        CFBundleName: Skein
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        NFCReaderUsageDescription: Skein reads and writes the NFC stitch clips on your projects so every tap is tracked.
        ITSAppUsesNonExemptEncryption: false
